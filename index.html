<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Aquarelle</title>
	<meta name="description" content="Turns a reference image into a procedurally painted watercolor, in real time.">
	<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
	<aside class="panel" aria-label="Configuration">
		<header class="brand">
			<h1>Aquarelle</h1>
		</header>

		<section class="group">
			<label class="drop" id="drop">
				<input type="file" id="file" accept="image/*" hidden>
				<canvas id="refPreview" width="1" height="1" hidden></canvas>
				<span id="dropHint">Drop an image or click to upload</span>
			</label>
			<div class="samples" id="samples" aria-label="Sample images"></div>
		</section>

		<section class="group">
			<div id="swatches" class="swatches" aria-label="Palette: click a colour to remove it, drag it onto another to turn it into that one"></div>
			<p class="muted small">Click a colour to remove it, or drag it onto another.</p>
			<div class="field">
				<label for="style">Image type</label>
				<select id="style">
					<option value="auto">Auto</option>
					<option value="photo">Photo</option>
					<option value="illustration">Illustration</option>
				</select>
			</div>
			<div class="field">
				<label for="pigments">Colours <output id="pigOut">8</output></label>
				<input type="range" id="pigments" min="3" max="16" value="8">
			</div>
			<div class="field">
				<label for="detail">Detail <output id="detailOut">Balanced</output></label>
				<input type="range" id="detail" min="0" max="4" value="1">
			</div>
			<div class="field">
				<label for="duration">Duration <output id="durOut">10 min</output></label>
				<input type="range" id="duration" min="1" max="30" step="1" value="10">
			</div>
		</section>

		<section class="group">
			<div class="buttons">
				<button id="start" type="button" class="primary" disabled>Paint</button>
				<button id="quick" type="button" disabled title="The whole painting, time-lapsed: about 20 seconds, longer if it needs to finish everything">Quick draw</button>
				<button id="realtime" type="button" disabled title="At the painter's own pace, with every animation; paints everything, never waits, ignores the duration">Real time</button>
				<button id="restart" type="button" disabled aria-label="Restart" title="Restart">↺</button>
			</div>
			<div class="buttons">
				<button id="exportPng" type="button" disabled>Save PNG</button>
				<button id="record" type="button" disabled>Record video</button>
			</div>
		</section>

		<details class="group more">
			<summary>More options</summary>
			<div class="field">
				<label for="speed">Speed <output id="speedOut">1×</output></label>
				<input type="range" id="speed" min="0" max="8" value="2">
			</div>
			<div class="field">
				<label for="seed">Seed <button id="dice" type="button" class="link" title="Random seed">Shuffle</button></label>
				<input type="number" id="seed" value="1234">
			</div>
			<label class="check"><input type="checkbox" id="hand" checked> Show the brush and drops</label>
			<label class="check"><input type="checkbox" id="compare"> Show the reference beside it</label>
		</details>

		<section class="group" id="devPanel" hidden>
			<h2>Diagnostics</h2>
			<div class="field">
				<label for="view">View</label>
				<select id="view">
					<option value="0">Painting</option>
					<option value="1">Wet areas</option>
					<option value="2">Error heatmap</option>
				</select>
			</div>
			<p id="planInfo" class="muted small"></p>
			<dl id="perf" class="perf"></dl>
			<button id="bench" type="button">Run benchmark on the samples</button>
			<div id="benchOut" class="bench"></div>
		</section>
	</aside>

	<main class="stage">
		<div class="hud" aria-live="polite">
			<span id="stageName" class="stage-name">Ready</span>
			<span id="dryFast" class="pill" hidden>Drying ×10</span>
			<span id="time">0:00 / 10:00</span>
			<span id="fps" class="pill dev" hidden>— fps</span>
			<span id="sim" class="pill dev" hidden>similarity —</span>
		</div>
		<div class="progress"><div id="bar"></div></div>
		<div class="canvases" id="canvases">
			<figure class="paint">
				<canvas id="paint" aria-label="Watercolor painting"></canvas>
				<canvas id="overlay" aria-hidden="true"></canvas>
			</figure>
			<figure class="ref" id="refFig" hidden>
				<canvas id="refCanvas"></canvas>
				<figcaption>Reference</figcaption>
			</figure>
		</div>
		<p class="status" id="status">Pick a sample or drop an image to begin.</p>
	</main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
